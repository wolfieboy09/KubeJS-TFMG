name: Build

on:
  push:
    branches:
      - main
      - 1.21.1
      - port-1.21.1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@v4

  build:
    name: ${{ matrix.profile }} / KubeJS ${{ matrix.kubejs }}
    needs: wrapper-validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - stable
          - current
        kubejs:
          - 2101.7.2-build.368
          - 2101.7.2-build.370

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: >-
          ./gradlew --no-daemon clean build
          -PtfmgProfile=${{ matrix.profile }}
          -Pkubejs_version=${{ matrix.kubejs }}

      - name: Verify packaged metadata
        shell: bash
        run: |
          JAR_FILE="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR_FILE"

          jar tf "$JAR_FILE" > jar-entries.txt
          grep -qx 'META-INF/neoforge.mods.toml' jar-entries.txt
          grep -qx 'LICENSE_tfmgjs' jar-entries.txt
          test "$(grep -Ec '^data/tfmg/kubejs/recipe_schema/[^/]+\.json$' jar-entries.txt)" -eq 8
          grep -qx 'data/tfmg/kubejs/recipe_schema/base/processing_with_time.json' jar-entries.txt
          ! grep -Eq '^(META-INF/mods\.toml|pack\.mcmeta|tfmgjs\.mixins\.json)$' jar-entries.txt

          unzip -p "$JAR_FILE" META-INF/neoforge.mods.toml > generated-neoforge.mods.toml
          ! grep -F '${' generated-neoforge.mods.toml
          EXPECTED_NEO_RANGE="$(sed -n 's/^neo_version_range=//p' gradle.properties)"
          test -n "$EXPECTED_NEO_RANGE"
          grep -Fq "versionRange=\"$EXPECTED_NEO_RANGE\"" generated-neoforge.mods.toml

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: tfmgjs-${{ matrix.profile }}-kubejs-${{ matrix.kubejs }}
          path: build/libs/*.jar
          if-no-files-found: error
